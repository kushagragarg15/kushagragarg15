name: generate arcade contribution graph

on:
  schedule:            # regenerate once a day
    - cron: '0 0 * * *'
  workflow_dispatch:   # lets you trigger it by hand from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # pick one: pacman | breakout | galaga | puzzle-bobble | bomberman | minesweeper
          # comma-separate to generate more than one
          games: 'breakout'
          hide_month_labels: 'false'

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
